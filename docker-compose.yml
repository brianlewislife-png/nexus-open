version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    volumes:
      - nexus-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - nexus-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus?schema=public
      REDIS_URL: redis://redis:6379
      NEXUS_BASE_URL: http://api:3001
      NEXUS_WEB_URL: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_NEXUS_URL_GITHUB: ${NEXT_PUBLIC_NEXUS_URL_GITHUB:-}
        NEXT_PUBLIC_NEXUS_URL_WEBSITE: ${NEXT_PUBLIC_NEXUS_URL_WEBSITE:-}
        NEXT_PUBLIC_NEXUS_URL_INSTAGRAM: ${NEXT_PUBLIC_NEXUS_URL_INSTAGRAM:-}
        NEXT_PUBLIC_NEXUS_URL_TELEGRAM: ${NEXT_PUBLIC_NEXUS_URL_TELEGRAM:-}
        NEXT_PUBLIC_NEXUS_URL_WHATSAPP: ${NEXT_PUBLIC_NEXUS_URL_WHATSAPP:-}
    container_name: nexus-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXUS_WEB_URL: http://localhost:3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: packages/database/Dockerfile
    container_name: nexus-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus?schema=public
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && echo 'Migration and seed complete'"
    restart: "no"

volumes:
  nexus-postgres-data:
  nexus-redis-data: